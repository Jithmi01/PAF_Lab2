<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Side - Call Translation</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.3.2/socket.io.js"></script>
    <style>
body {
    font-family: Arial, sans-serif;
    display: flex;
    height: 100vh;
    margin: 0;
    background-color: #f5f5f5;
  }

  .left-panel {
    width: 25%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background-color: #28a745;
    color: white;
    padding: 30px;
    box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
  }

  .left-panel h2 {
    margin-bottom: 20px;
    font-size: 22px;
    text-align: center;
  }

  .left-panel button {
    width: 90%;
    padding: 15px;
    margin: 10px 0;
    font-size: 18px;
    border: none;
    cursor: pointer;
    color: white;
    border: 1.5px solid black;
    background-color: #1f7a35;
    border-radius: 8px;
    transition: 0.3s;
  }

  .left-panel button:hover {
    background-color: #165c27;
  }

  .chat-container {
    width: 75%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 20px;
    overflow-y: auto;
  }

  .chat-box {
    height: 90%;
    background: white;
    padding: 20px;
    border-radius: 10px;
    overflow-y: auto;
    box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
    display: flex;
    flex-direction: column;
  }

  .message {
    margin: 10px 0;
    padding: 12px;
    border-radius: 10px;
    max-width: 75%;
    font-size: 16px;
  }

  .foreign {
    background-color: #e1e1e1;
    color: black;
    border: 1px solid #ccc;
    align-self: flex-start;
    text-align: left;
    padding: 10px;
    border-radius: 10px;
    max-width: 75%;
  }

  .translated {
    background-color: #28a745;
    color: white;
    align-self: flex-end;
    text-align: right;
    padding: 10px;
    border-radius: 10px;
    max-width: 75%;
  }
    </style>
  </head>
  <body>
    <div class="left-panel">
      <h2>Agent Side - Live Translation</h2>
      <button id="agent-start">🎤 Start Speaking</button>
      <button id="agent-stop">⛔ Stop Speaking</button>
    </div>

    <div class="chat-container">
      <div class="chat-box" id="chatBox"></div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const socket = io();
        const chatBox = document.getElementById("chatBox");
        const startButton = document.getElementById("agent-start");
        const stopButton = document.getElementById("agent-stop");

        function addMessage(text, type) {
          let message = document.createElement("div");
          message.classList.add("message", type);
          message.textContent = text;
          chatBox.appendChild(message);
        }

        function updateButtonState(isActive) {
          if (isActive) {
            startButton.style.backgroundColor = "#28a745";
          } else {
            startButton.style.backgroundColor = "#1f7a35";
          }
        }

        startButton.addEventListener("click", function () {
          console.log("Agent Microphone ON");
          socket.emit("start_agent_speech");
          updateButtonState(true);
        });

        stopButton.addEventListener("click", function () {
          console.log("Agent Microphone OFF");
          socket.emit("stop_agent_speech");
          updateButtonState(false);
        });

        socket.on("agent_translation_update", function (data) {
          addMessage(data.translated, "translated");

          fetch("/speak", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: data.translated, language: "si" }),
          })
            .then((response) => response.blob())
            .then((blob) => {
              let audio = new Audio(URL.createObjectURL(blob));
              audio.play();
            })
            .catch((error) => console.error("Speech error:", error));
        });

        socket.on("speak_text", function (data) {
          fetch("/speak", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text: data.text, language: data.language }),
          })
            .then((response) => response.blob())
            .then((blob) => {
              let audio = new Audio(URL.createObjectURL(blob));
              audio.play();
            })
            .catch((error) => console.error("Speech error:", error));
        });
        socket.on("agent_original_text", function (data) {
          addMessage(data.text, "foreign");
        });

        socket.on("clear_chat", function () {
          document.getElementById("chatBox").innerHTML = "";
        });
      });
    </script>
  </body>
</html>
